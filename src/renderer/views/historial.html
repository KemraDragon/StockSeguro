<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>StockSeguro - Historial</title>
  <link rel="stylesheet" href="../styles/style.css" />

  <style>
  /* ===== Modal de trabajador — look StockSeguro (blanco + verde claro) ===== */
  .mod-profile{
    max-width:720px;
    border-radius:18px;
    overflow:hidden;
    border:1px solid #e5e7eb;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
    background:#fff;
  }
  .mod-profile .modal-header{ display:none; }

  .profile-header{
    position:relative;
    background:#e8fbef;
    border-bottom:1px solid #b7f0c7;
    padding:38px 24px 58px;
    text-align:center;
  }
  .avatar-hero{
    position:absolute; left:50%; bottom:-48px; transform:translateX(-50%);
    width:96px; height:96px; border-radius:999px; overflow:hidden;
    border:6px solid #fff; box-shadow:0 6px 16px rgba(0,0,0,.12);
  }
  .avatar-hero img{ width:100%; height:100%; object-fit:cover; background:#f3f4f6; }

  .profile-name{ margin:0; font-size:22px; font-weight:900; color:#11693a; }
  .profile-sub{ margin-top:6px; color:#11693a; opacity:.8; font-weight:700; }

  .profile-body{
    padding:72px 22px 22px;
    display:grid; gap:14px;
  }
  .field{ display:grid; grid-template-columns:220px 1fr; align-items:center; gap:10px; }
  .label{ color:#6b7280; font-size:14px; }
  .value{ font-weight:800; }

  .pin-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .pin-input{
    padding:10px 12px; border:1px solid #d1d5db; border-radius:10px; background:#fff; width:180px;
  }
  .link-email { text-decoration: underline; color: #11693a; }
  .link-email:hover { opacity: .85; }

  /* ===== Popover listado de trabajadores (centrado) ===== */
  .pop-trab { position: relative; display:inline-block; }

  .pop-panel{
    position:absolute;
    top:48px;
    left:50%;
    transform:translateX(-50%);
    z-index:1000;
    min-width:300px; max-height:300px; overflow:auto;
    background:#fff; border:1px solid #e5e7eb; border-radius:14px;
    box-shadow:0 18px 50px rgba(0,0,0,.20), 0 2px 10px rgba(0,0,0,.05);
    padding:6px; display:none;
  }
  /* “Flechita” centrada */
  .pop-panel::before{
    content:""; position:absolute; top:-8px; left:50%; transform:translateX(-50%) rotate(45deg);
    width:16px; height:16px;
    background:#fff; border-left:1px solid #e5e7eb; border-top:1px solid #e5e7eb;
  }

  .pop-item{
    width:100%; text-align:left; border:0; background:#fff; border-radius:10px;
    padding:10px 12px; cursor:pointer; display:grid; grid-template-columns:auto 1fr;
    align-items:center; gap:10px; position:relative;
  }
  .pop-item + .pop-item{ margin-top:4px; }
  .pop-item:hover,
  .pop-item:focus{ outline:none; background:#f7f8fb; }

  /* Avatar con iniciales */
  .pop-avatar{
    width:36px; height:36px; border-radius:999px; display:grid; place-items:center;
    font-weight:800; background:#e8fbef; color:#11693a; border:1px solid #b7f0c7;
  }

  .pop-lines{ display:flex; flex-direction:column; line-height:1.15; }
  .pop-name{ font-weight:800; font-size:14px; color:#111827; }
  .pop-meta{ display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; align-items:center; }

  /* Chip de rol y RUT monoespaciado */
  .chip{
    font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px;
    background:#f1f5f9; color:#475569; border:1px solid #e2e8f0;
  }
  .chip--admin{ background:#e8fbef; color:#11693a; border-color:#b7f0c7; }
  .rut-mono{
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    white-space:nowrap;
  }
  </style>

  <!-- Exponer los trabajadores como variable global para el popover -->
  <script type="module">
    import { users } from '../data/BDTrabajadores.js';
    window.STOCKSEGURO_USERS = users;
  </script>
</head>
<body>
  <div class="app-shell">
    <div class="top-row">
      <button class="btn-logout-small" onclick="volver()" title="Volver">← Volver</button>
    </div>

    <header class="brand-row">
      <div class="app-brand">
        <img src="../assets/sTOCKsEGURO.png" alt="Logo StockSeguro" />
        <h1>Historial de Operaciones</h1>
      </div>
    </header>

    <div class="welcome-row">
      <div id="bienvenida" class="welcome-pill">Acceso concedido</div>
    </div>

    <div class="toolbar">
      <button type="button" class="boton-exportar" onclick="exportarHistorial()">📤 Exportar historial a Excel</button>
      <button type="button" class="btn-clear" onclick="borrarHistorial()">Borrar historial</button>

      <!-- Contenedor del botón con popover de trabajadores -->
      <span class="pop-trab">
        <button id="btn-ver-trab" type="button" class="boton-exportar" onclick="toggleListaTrabajadores(event)">👤 Ver trabajador</button>
        <div id="panel-trabajadores" class="pop-panel" aria-label="Lista de trabajadores"></div>
      </span>
    </div>

    <section class="lista-row">
      <table class="historial-table" style="width:100%; border-collapse:collapse; background:#fff; border:1px solid #e5e7eb; border-radius:12px; overflow:hidden;">
        <thead>
          <tr style="background:#f9fafb;">
            <th style="text-align:left; padding:10px 12px;">Fecha/Hora</th>
            <th style="text-align:left; padding:10px 12px;">Operación</th>
            <th style="text-align:left; padding:10px 12px;">Detalle</th>
            <th style="text-align:left; padding:10px 12px;">Responsable</th>
          </tr>
        </thead>
        <tbody id="tbody-historial"></tbody>
      </table>
      <p id="vacio" class="muted" style="margin-top:10px; display:none;">Sin operaciones registradas.</p>
    </section>
  </div>

  <!-- Modal de trabajador -->
  <div id="modal-trabajador" class="modal-overlay" style="display:none;" onclick="cerrarModalTrabajador(event)">
    <div class="modal-card mod-profile" onclick="event.stopPropagation()">
      <div class="profile-header">
        <h2 class="profile-name" id="m-nombre">—</h2>
        <div class="profile-sub" id="m-rut">—</div>
        <div class="avatar-hero">
          <img id="avatarHero" alt="Avatar"/>
        </div>
        <button type="button" class="modal-close" onclick="cerrarModalTrabajador()" title="Cerrar">✖</button>
      </div>
      <div class="profile-body">
        <div class="field"><div class="label">Último ingreso:</div><div class="value" id="m-ultimo">—</div></div>
        <div class="field"><div class="label">Empresa asociada:</div><div class="value" id="m-empresa">—</div></div>
        <div class="field">
          <div class="label">Correo (Gmail):</div>
          <div class="value"><a id="m-email" class="link-email" href="#" target="_blank" rel="noopener">—</a></div>
        </div>
        <div class="field">
          <div class="label">Contraseña de acceso (PIN):</div>
          <div class="pin-row">
            <input id="m-pin" class="pin-input" type="password" readonly value=""/>
            <button class="btn-choose" onclick="togglePin()">👁️ Mostrar</button>
          </div>
        </div>
        <div class="field"><div class="label">Número de teléfono:</div><div class="value" id="m-fono">—</div></div>
      </div>
    </div>
  </div>

  <script>
    // ===== Dependencias disponibles en renderer =====
    const XLSX  = require('xlsx');
    const path  = require('path');
    const { dialog } = require('@electron/remote');

    // ===== Guardas y acceso =====
    (function () {
      const u = JSON.parse(localStorage.getItem('usuarioLogueado') || 'null');
      if (!u) { window.location.href = 'login.html'; return; }
      if (u.rol !== 'admin') { alert('Solo administradores.'); window.location.href = 'principal.html'; return; }
      document.getElementById('bienvenida').textContent = `Bienvenido (admin): ${u.nombre}`;
    })();

    function volver(){ window.location.href = 'principal.html'; }

    function cargarEventos(){
      try { return JSON.parse(localStorage.getItem('eventos') || '[]'); }
      catch { return []; }
    }
    function guardarEventos(list){
      localStorage.setItem('eventos', JSON.stringify(list));
    }

    const KEY_RUTA_HIST = 'rutaHistorialExcel';
    function obtenerRutaHistorial() {
      return localStorage.getItem(KEY_RUTA_HIST) || null;
    }
    function seleccionarRutaHistorial() {
      const result = dialog.showOpenDialogSync({
        title: 'Selecciona una carpeta para guardar el historial',
        properties: ['openDirectory']
      });
      if (result && result.length > 0) {
        localStorage.setItem(KEY_RUTA_HIST, result[0]);
        alert(`📁 Carpeta seleccionada:\n${result[0]}`);
        return result[0];
      }
      return null;
    }

    function render(){
      const tbody = document.getElementById('tbody-historial');
      const vacio = document.getElementById('vacio');
      const eventos = cargarEventos().sort((a,b)=> new Date(b.timestamp) - new Date(a.timestamp));
      tbody.innerHTML = '';
      if (!eventos.length){ vacio.style.display = 'block'; return; }
      vacio.style.display = 'none';
      for (const e of eventos){
        const tr = document.createElement('tr');
        const fecha = new Date(e.timestamp).toLocaleString();
        tr.innerHTML = `
          <td style="padding:10px 12px; border-bottom:1px solid #eee;">${fecha}</td>
          <td style="padding:10px 12px; border-bottom:1px solid #eee; font-weight:700;">${e.tipo || ''}</td>
          <td style="padding:10px 12px; border-bottom:1px solid #eee;">${e.detalle || ''}</td>
          <td style="padding:10px 12px; border-bottom:1px solid #eee;">${e.usuario?.nombre || ''}</td>
        `;
        tbody.appendChild(tr);
      }
    }

    function exportarHistorial(){
      const eventos = cargarEventos().sort((a,b)=> new Date(b.timestamp) - new Date(a.timestamp));
      if (!eventos.length){ alert('No hay eventos que exportar.'); return; }

      let ruta = obtenerRutaHistorial();
      if (!ruta) {
        ruta = seleccionarRutaHistorial();
        if (!ruta) return;
      }

      const data = eventos.map(e => ({
        'Fecha/Hora': new Date(e.timestamp).toLocaleString(),
        'Operación' : e.tipo || '',
        'Detalle'   : e.detalle || '',
        'Responsable': e.usuario?.nombre || ''
      }));

      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.json_to_sheet(data);
      ws['!cols'] = [{wch:20},{wch:24},{wch:60},{wch:28}];
      XLSX.utils.book_append_sheet(wb, ws, 'Historial');

      const fecha = new Date().toISOString().slice(0,10);
      const nombreArchivo = `historial-${fecha}.xlsx`;
      const filePath = path.join(ruta, nombreArchivo);

      XLSX.writeFile(wb, filePath);
      alert(`✅ Historial exportado en:\n${filePath}`);

      try {
        const u = JSON.parse(localStorage.getItem('usuarioLogueado') || '{}');
        const lista = cargarEventos();
        lista.push({
          id: (Date.now().toString(36) + Math.random().toString(36).slice(2)),
          tipo: 'exportacion_historial',
          detalle: filePath,
          usuario: { nombre: u?.nombre || '', rut: u?.rut || '' },
          timestamp: new Date().toISOString()
        });
        guardarEventos(lista);
        render();
      } catch {}
    }

    function borrarHistorial(){
      if (!confirm('¿Borrar todo el historial de operaciones?')) return;
      guardarEventos([]); render();
    }

    // ====== MODAL de trabajador (acepta usuario opcional) ======
    function abrirModalTrabajador(usuarioSeleccionado){
      const modal = document.getElementById('modal-trabajador');

      // Si viene usuario elegido desde popover, úsalo; si no, usa el logueado.
      const u = usuarioSeleccionado || JSON.parse(localStorage.getItem('usuarioLogueado') || '{}');
      const ultimo = localStorage.getItem('ultimoIngresoSistema');

      const avatar = document.getElementById('avatarHero');
      const candidato = `../assets/avatar/${(u.rut || '').replaceAll('.','').replaceAll('-','')}.jpg`;
      const placeholder = "data:image/svg+xml;utf8," +
        "<svg xmlns='http://www.w3.org/2000/svg' width='96' height='96' viewBox='0 0 96 96'>" +
        "<circle cx='48' cy='32' r='18' fill='%23e5e7eb'/>" +
        "<rect x='18' y='56' width='60' height='28' rx='14' fill='%23e5e7eb'/></svg>";
      avatar.onerror = () => { avatar.src = placeholder; };
      avatar.src = candidato;

      document.getElementById('m-nombre').textContent  = u.nombre || '—';
      document.getElementById('m-ultimo').textContent  = ultimo ? new Date(ultimo).toLocaleString() : '—';
      document.getElementById('m-rut').textContent     = u.rut || '—';
      document.getElementById('m-empresa').textContent = u.empresa || '—';
      document.getElementById('m-pin').value           = u.pin || '';
      document.getElementById('m-fono').textContent    = u.telefono || '—';

      const emailEl = document.getElementById('m-email');
      const email = u.email || u.gmail || u.correo || '';
      if (email) { emailEl.textContent = email; emailEl.href = `mailto:${email}`; }
      else { emailEl.textContent = '—'; emailEl.removeAttribute('href'); }

      modal.style.display = 'grid';
    }
    function cerrarModalTrabajador(ev){
      if (ev && ev.target && ev.currentTarget !== ev.target) return;
      document.getElementById('modal-trabajador').style.display = 'none';
      const pin = document.getElementById('m-pin');
      pin.type = 'password';
    }
    function togglePin(){
      const pin = document.getElementById('m-pin');
      pin.type = (pin.type === 'password') ? 'text' : 'password';
    }

    // ====== LISTA emergente de trabajadores ======
    function iniciales(nombre='') {
      return String(nombre)
        .split(/\s+/).filter(Boolean).slice(0,2).map(s=>s[0].toUpperCase()).join('');
    }

    function construirListaTrabajadores() {
      const list = Array.isArray(window.STOCKSEGURO_USERS) ? window.STOCKSEGURO_USERS : [];
      const panel = document.getElementById('panel-trabajadores');
      if (!panel) return;

      if (!list.length) {
        panel.innerHTML = `<div class="pop-item" style="cursor:default">No hay trabajadores registrados</div>`;
        return;
      }

      panel.setAttribute('role','listbox');
      panel.innerHTML = list.map((u,idx) => `
        <button class="pop-item" role="option" data-index="${idx}" tabindex="-1"
                onclick="seleccionarTrabajador('${u.rut.replace(/'/g,"&#39;")}')">
          <span class="pop-avatar">${iniciales(u.nombre)}</span>
          <span class="pop-lines">
            <span class="pop-name">${u.nombre}</span>
            <span class="pop-meta">
              <span class="chip ${u.rol==='admin' ? 'chip--admin':''}">${u.rol || 'trabajador'}</span>
              <span class="chip rut-mono">${u.rut}</span>
            </span>
          </span>
        </button>
      `).join('');
    }

    function toggleListaTrabajadores(ev){
      const panel = document.getElementById('panel-trabajadores');
      if (!panel) return;
      if (panel.style.display === 'block') {
        panel.style.display = 'none';
        return;
      }
      construirListaTrabajadores();
      panel.style.display = 'block';

      // Enfocar primer ítem al abrir
      const items = panel.querySelectorAll('.pop-item');
      if (items.length) items[0].tabIndex = 0, items[0].focus();
    }

    function ocultarListaTrabajadores(){
      const panel = document.getElementById('panel-trabajadores');
      if (panel) panel.style.display = 'none';
    }

    // Cierra el popover si se hace click fuera
    document.addEventListener('click', (e) => {
      const cont = document.querySelector('.pop-trab');
      if (!cont) return;
      if (!cont.contains(e.target)) ocultarListaTrabajadores();
    });

    // Navegación por teclado dentro del popover
    document.addEventListener('keydown', (e) => {
      const panel = document.getElementById('panel-trabajadores');
      if (!panel || panel.style.display !== 'block') return;

      const items = Array.from(panel.querySelectorAll('.pop-item'));
      if (!items.length) return;

      const idx = items.findIndex(el => el === document.activeElement);
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        const next = items[(idx + 1 + items.length) % items.length];
        next.tabIndex = 0; next.focus();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        const prev = items[(idx - 1 + items.length) % items.length];
        prev.tabIndex = 0; prev.focus();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        document.activeElement?.click();
      } else if (e.key === 'Escape') {
        ocultarListaTrabajadores();
        document.getElementById('btn-ver-trab')?.focus();
      }
    });

    // Selección desde el popover → abrir modal con ese usuario
    function seleccionarTrabajador(rut){
      const lista = Array.isArray(window.STOCKSEGURO_USERS) ? window.STOCKSEGURO_USERS : [];
      const u = lista.find(x => x.rut === rut);
      ocultarListaTrabajadores();
      if (!u) { alert('No se encontró el trabajador seleccionado.'); return; }
      abrirModalTrabajador(u);
    }

    // ====== Exponer funciones al DOM ======
    window.exportarHistorial = exportarHistorial;
    window.borrarHistorial   = borrarHistorial;
    window.abrirModalTrabajador = abrirModalTrabajador;
    window.cerrarModalTrabajador = cerrarModalTrabajador;
    window.togglePin = togglePin;

    window.toggleListaTrabajadores = toggleListaTrabajadores;
    window.seleccionarTrabajador   = seleccionarTrabajador;

    // Inicial
    render();
  </script>
</body>
</html>
