<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StockSeguro - Login</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-container {
      background-color: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      width: 320px;
      text-align: center;
    }

    img {
      width: 150px;
      margin-bottom: 20px;
    }

    h2 {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      border: none;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }

    .error {
      color: red;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<div class="login-container">

  <img src="assets/sTOCKsEGUROnegro.png" alt="Logo StockSeguro">

  <h2>Ingreso al Sistema</h2>

  <div class="error" id="error"></div>

  <input type="text" id="rut" placeholder="Ingrese su RUT" oninput="formatearRut(this)">
  <input type="password" id="pin" placeholder="Ingrese su PIN (4 dígitos)">
  <button onclick="handleLogin()">Ingresar</button>

</div>

<script type="module">
import { users } from './BDTrabajadores.js'

function formatearRut(input) {
  let valor = input.value.replace(/[^\dkK]/gi, '').toUpperCase();

  if (valor.length > 10) { // máximo 9 números + 1 dv
    valor = valor.slice(0, 10);
  }

  if (valor.length <= 1) {
    input.value = valor;
    return;
  }

  const cuerpo = valor.slice(0, -1);
  const dv = valor.slice(-1);

  let formateado = '';
  let i = 0;

  for (let j = cuerpo.length - 1; j >= 0; j--) {
    formateado = cuerpo[j] + formateado;
    i++;
    if (i % 3 === 0 && j !== 0) {
      formateado = '.' + formateado;
    }
  }

  input.value = formateado + '-' + dv;
}

function handleLogin() {
  const rut = document.getElementById('rut').value.trim();
  const pin = document.getElementById('pin').value.trim();
  const errorDiv = document.getElementById('error');

  if (rut === '' || pin === '') {
    errorDiv.textContent = 'Debe ingresar RUT y PIN.';
    return;
  }

  if (pin.length !== 4) {
    errorDiv.textContent = 'El PIN debe tener 4 dígitos.';
    return;
  }

  const userFound = users.find(user => user.rut === rut && user.pin === pin);

  if (userFound) {
    localStorage.setItem('usuarioLogueado', JSON.stringify(userFound));
    window.location.href = 'index.html';
  } else {
    errorDiv.textContent = 'RUT o PIN incorrectos.';
  }
}

window.handleLogin = handleLogin;
window.formatearRut = formatearRut;
</script>

</body>
</html>
